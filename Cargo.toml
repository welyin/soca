[workspace]
resolver = "3"
members = [
    "crates/contracts",
    "crates/storage",
    "crates/core",
    "crates/core-topology",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
